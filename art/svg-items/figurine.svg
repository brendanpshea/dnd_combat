    <circle cx="316" cy="290" r="54" fill="url(#figurine-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="278,254 292,214 308,252" fill="url(#figurine-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="316,248 330,208 346,250" fill="url(#figurine-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="332" cy="284" r="7" fill="#2a2333"/>
