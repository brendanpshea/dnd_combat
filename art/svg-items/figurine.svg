    <ellipse cx="242" cy="330" rx="72" ry="40" fill="url(#figurine-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <path d="M 176 322 Q 138 300 148 254 Q 158 262 168 258 Q 160 280 190 300 Z"
