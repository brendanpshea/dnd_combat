<svg xmlns="http://www.w3.org/2000/svg" viewBox="132.5 184.5 251 251" data-ink="224.1" width="100%" height="100%">
  <defs>
    <filter id="figurine-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="figurine-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
