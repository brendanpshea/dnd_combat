    <linearGradient id="figurine-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- FIGURINE OF WONDROUS POWER (100% Transparent Background) -->
