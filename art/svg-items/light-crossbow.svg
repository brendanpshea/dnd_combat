<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -30 520 520" data-ink="360" width="100%" height="100%">
  <defs>
    <filter id="light-crossbow-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="light-crossbow-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="light-crossbow-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- LIGHT CROSSBOW (100% Transparent Background) -->
  <g filter="url(#light-crossbow-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="245" y="110" width="22" height="300" rx="3" fill="url(#light-crossbow-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <path d="M 130,130 L 256,260 L 382,130" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 245,115 C 200,115 150,115 130,130 C 120,135 125,145 135,140 C 160,130 205,128 245,125 Z" fill="url(#light-crossbow-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 267,115 C 312,115 362,115 382,130 C 392,135 387,145 377,140 C 352,130 307,128 267,125 Z" fill="url(#light-crossbow-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <line x1="256" y1="260" x2="256" y2="70" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
    <polygon points="256,50 268,75 256,85 244,75" fill="#ffffff" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>