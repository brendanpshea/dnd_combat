<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -2 520 520" data-ink="344" width="100%" height="100%">
  <defs>
    <filter id="morningstar-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="morningstar-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="morningstar-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="morningstar-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="morningstar-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- MORNINGSTAR (100% Transparent Background) -->
  <g filter="url(#morningstar-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="180" width="18" height="250" rx="3" fill="url(#morningstar-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="150" r="54" fill="url(#morningstar-blade-light)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="256,150 256,86 268,150" fill="url(#morningstar-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 256,214 244,150" fill="url(#morningstar-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 192,150 256,138" fill="url(#morningstar-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 320,150 256,162" fill="url(#morningstar-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 211,105 267,138" fill="url(#morningstar-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 301,195 245,162" fill="url(#morningstar-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 301,105 267,162" fill="url(#morningstar-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,150 211,195 245,138" fill="url(#morningstar-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="240" y="196" width="32" height="20" rx="4" fill="url(#morningstar-brass-grad)" stroke="#2a2333" stroke-width="5"/>
  </g>
</svg>