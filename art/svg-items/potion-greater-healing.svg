<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 49 392 392" data-ink="350" width="100%" height="100%">
  <defs>
    <filter id="potion-greater-healing-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="potion-greater-healing-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <radialGradient id="potion-greater-healing-liquid-ruby" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff758c"/>
      <stop offset="60%" stop-color="#ff1244"/>
      <stop offset="90%" stop-color="#990022"/>
      <stop offset="100%" stop-color="#4a000f"/>
    </radialGradient>

  </defs>
  <!-- POTION OF GREATER HEALING (100% Transparent Background) -->
  <g filter="url(#potion-greater-healing-drop-shadow)">
    <path d="M 226,70 L 286,70 L 280,110 L 232,110 Z" fill="url(#potion-greater-healing-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="230,110 282,110 300,160 385,250 355,420 157,420 127,250 212,160" fill="#1a1224" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="236,125 276,125 290,165 370,250 340,405 172,405 142,250 222,165" fill="url(#potion-greater-healing-liquid-ruby)"/>
    <g fill="none" stroke="url(#potion-greater-healing-gold-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 256,110 L 256,420" stroke-width="8"/>
      <path d="M 127,250 Q 200,280 256,250 Q 312,280 385,250"/>
    </g>
    <g transform="translate(256, 310)" stroke="#2a2333" stroke-width="3">
      <path d="M -12,-30 L 12,-30 L 12,-12 L 30,-12 L 30,12 L 12,12 L 12,30 L -12,30 L -12,12 L -30,12 L -30,-12 L -12,-12 Z" fill="url(#potion-greater-healing-gold-grad)"/>
    </g>
  </g>
</svg>