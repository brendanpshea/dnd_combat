<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 54.8 412.3 412.3" data-ink="368.1" width="100%" height="100%">
  <defs>
    <filter id="scroll-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <filter id="scroll-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="scroll-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="scroll-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="70%" stop-color="#cc1133"/>
      <stop offset="100%" stop-color="#7a001e"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="scroll-parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d9"/>
      <stop offset="60%" stop-color="#ebd89b"/>
      <stop offset="100%" stop-color="#c4af6e"/>
    </linearGradient>

    <linearGradient id="scroll-parchment-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8a15c"/>
      <stop offset="100%" stop-color="#786328"/>
    </linearGradient>

  </defs>
  <!-- SCROLL (100% Transparent Background) -->
  <g filter="url(#scroll-drop-shadow)">
    <path d="M 100,360 L 220,445" stroke="url(#scroll-brass-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 120,340 C 180,390 320,430 380,390 L 410,150 C 350,190 210,150 150,100 Z" fill="url(#scroll-parchment)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 150,100 C 210,150 350,190 410,150 C 430,135 420,100 390,90 C 330,70 190,70 130,110 C 110,125 125,145 150,100 Z" fill="url(#scroll-parchment-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <g fill="none" stroke="#d8b4fe" stroke-width="3" opacity="0.95" filter="url(#scroll-glow-purple)">
      <circle cx="270" cy="265" r="50" stroke-dasharray="8 4"/>
      <circle cx="270" cy="265" r="35"/>
      <polygon points="270,225 305,285 235,285"/>
      <polygon points="270,305 305,245 235,245"/>
    </g>
    <path d="M 125,320 C 145,355 170,380 185,410" fill="none" stroke="url(#scroll-ribbon-grad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="165" cy="375" r="22" fill="url(#scroll-ribbon-grad)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>