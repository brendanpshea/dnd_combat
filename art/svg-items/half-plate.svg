<svg xmlns="http://www.w3.org/2000/svg" viewBox="75.4 95.6 361.2 361.2" data-ink="322.5" width="100%" height="100%">
  <defs>
    <filter id="half-plate-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="half-plate-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="half-plate-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="half-plate-leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="half-plate-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- HALF PLATE (100% Transparent Background) -->
  <g filter="url(#half-plate-drop-shadow)">
    <!-- Under-garment Dark Leather Armor -->
    <path d="M 175,115 Q 256,130 337,115 L 395,185 L 345,220 L 325,190 L 325,430 Q 256,445 187,430 L 187,190 L 167,220 L 117,185 Z" fill="url(#half-plate-leather-dark)" stroke="#2a2333" stroke-width="5"/>
    <!-- Heavy Layered Pauldrons (Shoulders) -->
    <path d="M 115,170 Q 140,110 190,120 L 180,210 L 130,215 Z" fill="url(#half-plate-steel-rim)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 397,170 Q 372,110 322,120 L 332,210 L 382,215 Z" fill="url(#half-plate-steel-rim)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Steel Cuirass (Chestplate) -->
    <path d="M 190,135 Q 256,150 322,135 Q 340,240 325,320 Q 256,345 187,320 Q 172,240 190,135 Z" fill="url(#half-plate-steel-rim)" stroke="#2a2333" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 256,150 L 190,135 Q 172,240 187,320 Q 256,345 256,345 Z" fill="url(#half-plate-blade-light)" opacity="0.5"/>
    <line x1="256" y1="150" x2="256" y2="340" stroke="#2a2333" stroke-width="3"/>
    <!-- Faulds / Tassets (Thigh Guard Plates) -->
    <path d="M 190,335 L 245,345 L 235,420 L 185,400 Z" fill="url(#half-plate-steel-rim)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 322,335 L 267,345 L 277,420 L 327,400 Z" fill="url(#half-plate-steel-rim)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Brass Crest Medallion -->
    <circle cx="256" cy="235" r="16" fill="url(#half-plate-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <polygon points="256,223 261,235 256,247 251,235" fill="#2a2333"/>
  </g>
</svg>