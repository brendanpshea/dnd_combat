<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -12.5 520 520" data-ink="415" width="100%" height="100%">
  <defs>
    <filter id="sun-blade-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <filter id="sun-blade-sun-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="sun-blade-sun-plasma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffeb3b"/>
      <stop offset="70%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="sun-blade-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>
    <linearGradient id="sun-blade-ruby-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#5f0000"/>
    </linearGradient>
  </defs>
  <g filter="url(#sun-blade-shadow)" transform="rotate(-45 256 256)">
    <!-- Sunburst plasma blade -->
    <path d="M 256,40 L 268,260 L 244,260 Z" fill="url(#sun-blade-sun-plasma)" filter="url(#sun-blade-sun-glow)"/>
    <path d="M 256,40 L 268,260 L 244,260 Z" fill="url(#sun-blade-sun-plasma)"/>
    <!-- Inner core laser -->
    <line x1="256" y1="50" x2="256" y2="260" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Sunburst Crossguard -->
    <circle cx="256" cy="270" r="32" fill="url(#sun-blade-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="270" r="16" fill="url(#sun-blade-ruby-grad)" stroke="#2a2333" stroke-width="3"/>
    <!-- Solar Rays -->
    <path d="M 224,270 L 170,270 L 195,255 Z" fill="url(#sun-blade-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 288,270 L 342,270 L 317,255 Z" fill="url(#sun-blade-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 256,238 L 256,190 L 243,215 Z" fill="url(#sun-blade-gold-grad)" stroke="#2a2333" stroke-width="4"/>

    <!-- Hilt Handle -->
    <rect x="245" y="295" width="22" height="110" rx="6" fill="#3e2723" stroke="#2a2333" stroke-width="5"/>
    <line x1="245" y1="315" x2="267" y2="315" stroke="#f5b324" stroke-width="3"/>
    <line x1="245" y1="340" x2="267" y2="340" stroke="#f5b324" stroke-width="3"/>
    <line x1="245" y1="365" x2="267" y2="365" stroke="#f5b324" stroke-width="3"/>
    <line x1="245" y1="390" x2="267" y2="390" stroke="#f5b324" stroke-width="3"/>

    <!-- Pommel -->
    <polygon points="256,405 280,430 256,455 232,430" fill="url(#sun-blade-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="430" r="6" fill="url(#sun-blade-ruby-grad)" stroke="#2a2333" stroke-width="2"/>
  </g>
</svg>