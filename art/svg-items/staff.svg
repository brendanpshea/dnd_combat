<svg xmlns="http://www.w3.org/2000/svg" viewBox="48.8 67.8 414.4 414.4" data-ink="370" width="100%" height="100%">
  <defs>
    <filter id="staff-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <filter id="staff-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="staff-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <radialGradient id="staff-liquid-ruby" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff758c"/>
      <stop offset="60%" stop-color="#ff1244"/>
      <stop offset="90%" stop-color="#990022"/>
      <stop offset="100%" stop-color="#4a000f"/>
    </radialGradient>

  </defs>
  <!-- STAFF -->
  <g filter="url(#staff-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="236" y="200" width="40" height="260" rx="12" fill="url(#staff-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <path d="M 236,235 Q 256,250 276,235" stroke="#2a2333" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 236,290 Q 256,305 276,290" stroke="#2a2333" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 236,345 Q 256,360 276,345" stroke="#2a2333" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 226,205 Q 175,190 168,140 Q 158,105 190,90 Q 178,120 200,145 Q 220,165 244,175 Z" fill="url(#staff-wood-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 286,205 Q 337,190 344,140 Q 354,105 322,90 Q 334,120 312,145 Q 292,165 268,175 Z" fill="url(#staff-wood-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="256" cy="140" r="46" fill="#c026d3" filter="url(#staff-glow-purple)"/>
    <circle cx="256" cy="140" r="34" fill="url(#staff-liquid-ruby)" stroke="#2a2333" stroke-width="5"/>
    <line x1="230" y1="122" x2="282" y2="158" stroke="#2a2333" stroke-width="3" opacity="0.6"/>
    <line x1="282" y1="122" x2="230" y2="158" stroke="#2a2333" stroke-width="3" opacity="0.6"/>
  </g>
</svg>