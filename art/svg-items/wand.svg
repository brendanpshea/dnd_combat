<svg xmlns="http://www.w3.org/2000/svg" viewBox="141.8 153.8 228.5 228.5" data-ink="204" width="100%" height="100%">
  <defs>
    <filter id="wand-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <filter id="wand-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="wand-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="wand-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <radialGradient id="wand-liquid-ruby" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff758c"/>
      <stop offset="60%" stop-color="#ff1244"/>
      <stop offset="90%" stop-color="#990022"/>
      <stop offset="100%" stop-color="#4a000f"/>
    </radialGradient>

  </defs>
  <!-- WAND -->
  <g filter="url(#wand-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="245" y="220" width="22" height="150" rx="8" fill="url(#wand-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <rect x="240" y="345" width="32" height="20" rx="6" fill="url(#wand-brass-grad)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="200" r="34" fill="#c026d3" filter="url(#wand-glow-purple)"/>
    <circle cx="256" cy="200" r="22" fill="url(#wand-liquid-ruby)" stroke="#2a2333" stroke-width="5"/>
    <line x1="240" y1="188" x2="272" y2="212" stroke="#2a2333" stroke-width="3" opacity="0.6"/>
  </g>
</svg>