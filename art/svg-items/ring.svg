<svg xmlns="http://www.w3.org/2000/svg" viewBox="110.4 124.4 291.2 291.2" data-ink="260" width="100%" height="100%">
  <defs>
    <filter id="ring-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <filter id="ring-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="ring-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <radialGradient id="ring-liquid-ruby" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff758c"/>
      <stop offset="60%" stop-color="#ff1244"/>
      <stop offset="90%" stop-color="#990022"/>
      <stop offset="100%" stop-color="#4a000f"/>
    </radialGradient>

    <linearGradient id="ring-glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

  </defs>
  <!-- RING -->
  <g filter="url(#ring-drop-shadow)">
    <ellipse cx="256" cy="320" rx="130" ry="70" fill="none" stroke="url(#ring-gold-grad)" stroke-width="34"/>
    <ellipse cx="256" cy="320" rx="130" ry="70" fill="none" stroke="#2a2333" stroke-width="5"/>
    <ellipse cx="256" cy="320" rx="95" ry="42" fill="none" stroke="#2a2333" stroke-width="5"/>
    <g filter="url(#ring-glow-purple)">
      <polygon points="256,150 320,220 300,290 212,290 192,220" fill="url(#ring-liquid-ruby)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <polygon points="256,150 320,220 256,240 192,220" fill="url(#ring-glass-shine)" opacity="0.6"/>
    <path d="M 226,208 L 256,240 L 216,225 Z" fill="url(#ring-gold-grad)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 286,208 L 256,240 L 296,225 Z" fill="url(#ring-gold-grad)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>