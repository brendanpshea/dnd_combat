<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 12 520 520" data-ink="316" width="100%" height="100%">
  <defs>
    <filter id="mace-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="mace-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="mace-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="mace-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- MACE (100% Transparent Background) -->
  <g filter="url(#mace-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="140" width="18" height="290" rx="3" fill="url(#mace-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="247,115 170,140 247,165" fill="url(#mace-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="265,115 342,140 265,165" fill="url(#mace-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="256" cy="140" r="26" fill="url(#mace-blade-light)" stroke="#2a2333" stroke-width="5"/>
  </g>
</svg>