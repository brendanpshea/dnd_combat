<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.6 21.6 440.8 440.8" data-ink="244" width="100%" height="100%">
  <defs>
    <filter id="dagger-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="dagger-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="dagger-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="dagger-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="dagger-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="dagger-poison-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76ff03"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- DAGGER (100% Transparent Background) -->
  <g filter="url(#dagger-drop-shadow)" transform="rotate(-45 256 256)">
    <polygon points="256,130 244,280 256,280" fill="url(#dagger-blade-light)"/>
    <polygon points="256,130 268,280 256,280" fill="url(#dagger-blade-dark)"/>
    
    <!-- Poison Drip -->
    <path d="M 268,210 Q 271,230 267,250 L 268,280 L 256,280 Z" fill="url(#dagger-poison-grad)"/>
    <circle cx="273" cy="245" r="4" fill="#76ff03" stroke="#2a2333" stroke-width="2"/>
    <circle cx="277" cy="263" r="2.5" fill="#76ff03"/>
    
    <line x1="256" y1="160" x2="256" y2="260" stroke="#2a2333" stroke-width="5" stroke-linecap="round"/>
    <line x1="255" y1="160" x2="255" y2="255" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Swept Crossguard -->
    <path d="M 256,275 C 220,270 180,250 160,235 C 155,250 170,270 192,282 C 222,292 242,295 256,295 C 270,295 290,292 320,282 C 342,270 357,250 352,235 C 332,250 292,270 256,275 Z" fill="url(#dagger-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,268 268,282 256,296 244,282" fill="url(#dagger-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="282" r="5" fill="#00e676" stroke="#2a2333" stroke-width="2"/>
    <rect x="247" y="295" width="18" height="35" rx="3" fill="url(#dagger-leather-grad)" stroke="#2a2333" stroke-width="5"/>
    
    <line x1="247" y1="307" x2="265" y2="307" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="323" x2="265" y2="323" stroke="#f5b324" stroke-width="2.5"/>
    <circle cx="256" cy="346" r="18" fill="url(#dagger-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="346" r="8" fill="#d9910d" stroke="#2a2333" stroke-width="2"/>
    <circle cx="253" cy="343" r="2.5" fill="#ffffff"/>
    <polygon points="256,130 244,280 268,280" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,120 259,127 266,130 259,133 256,140 253,133 246,130 253,127" fill="#ffffff"/>
  </g>
</svg>