<svg xmlns="http://www.w3.org/2000/svg" viewBox="78.2 95.9 355.6 355.6" data-ink="317.5" width="100%" height="100%">
  <defs>
    <filter id="scale-mail-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="scale-mail-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="scale-mail-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="scale-mail-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- SCALE MAIL (100% Transparent Background) -->
  <g filter="url(#scale-mail-drop-shadow)">
    <!-- Leather Backing Vest -->
    <path d="M 175,115 Q 256,130 337,115 L 395,185 L 345,220 L 325,190 L 325,425 Q 256,440 187,425 L 187,190 L 167,220 L 117,185 Z" fill="url(#scale-mail-leather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Overlapping Metallic Scale Rows -->
    <g stroke="#2a2333" stroke-width="3" stroke-linejoin="round">
      <path d="M 195,160 Q 210,180 225,160 M 225,160 Q 240,180 255,160 M 255,160 Q 270,180 285,160 M 285,160 Q 300,180 315,160" fill="url(#scale-mail-steel-rim)"/>
      <path d="M 185,200 Q 200,225 215,200 M 215,200 Q 230,225 245,200 M 245,200 Q 260,225 275,200 M 275,200 Q 290,225 305,200 M 305,200 Q 320,225 335,200" fill="url(#scale-mail-blade-light)"/>
      <path d="M 195,245 Q 210,270 225,245 M 225,245 Q 240,270 255,245 M 255,245 Q 270,270 285,245 M 285,245 Q 300,270 315,245" fill="url(#scale-mail-steel-rim)"/>
      <path d="M 185,290 Q 200,315 215,290 M 215,290 Q 230,315 245,290 M 245,290 Q 260,315 275,290 M 275,290 Q 290,315 305,290 M 305,290 Q 320,315 335,290" fill="url(#scale-mail-blade-light)"/>
      <path d="M 195,335 Q 210,360 225,335 M 225,335 Q 240,360 255,335 M 255,335 Q 270,360 285,335 M 285,335 Q 300,360 315,335" fill="url(#scale-mail-steel-rim)"/>
      <path d="M 205,380 Q 220,405 235,380 M 235,380 Q 250,405 265,380 M 265,380 Q 280,405 295,380 M 295,380 Q 310,405 325,380" fill="url(#scale-mail-blade-light)"/>
    </g>
  </g>
</svg>