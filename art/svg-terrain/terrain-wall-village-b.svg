<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop" transform="translate(256 256) scale(1.12) translate(-256 -256)">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="190" ry="24" fill="#17120e" opacity="0.6"/>

    <!-- Bottom Left Crate -->
    <rect x="60" y="270" width="190" height="180" fill="#7a522f" stroke="#211308" stroke-width="13"/>
    <line x1="60" y1="270" x2="250" y2="450" stroke="#211308" stroke-width="8"/>
    <line x1="250" y1="270" x2="60" y2="450" stroke="#211308" stroke-width="8"/>

    <!-- Bottom Right Crate -->
    <rect x="250" y="250" width="200" height="200" fill="#694424" stroke="#211308" stroke-width="13"/>
    <line x1="250" y1="250" x2="450" y2="450" stroke="#211308" stroke-width="8"/>
    <line x1="450" y1="250" x2="250" y2="450" stroke="#211308" stroke-width="8"/>

    <!-- Top Barrel -->
    <ellipse cx="340" cy="110" rx="60" ry="20" fill="#8a5e38" stroke="#211308" stroke-width="10"/>
    <rect x="280" y="110" width="120" height="140" fill="#5c3d22" stroke="#211308" stroke-width="11"/>
    <line x1="280" y1="140" x2="400" y2="140" stroke="#3a3d42" stroke-width="10"/>
    <line x1="280" y1="210" x2="400" y2="210" stroke="#3a3d42" stroke-width="10"/>

    <!-- Rope Tied Around Stack -->
    <path d="M 60,360 Q 250,340 450,360" fill="none" stroke="#c7a76d" stroke-width="11"/>

  </g>
</svg>