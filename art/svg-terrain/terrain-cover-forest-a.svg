<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="215" ry="20" fill="#101c0c" opacity="0.6"/>

    <!-- Low Fallen Log (y=240 to 440) -->
    <!-- Log Main Body -->
    <rect x="50" y="270" width="410" height="170" rx="35" fill="#4d331c" stroke="#1c1109" stroke-width="13"/>

    <!-- Bark Texture Lines -->
    <line x1="90" y1="320" x2="380" y2="320" stroke="#311f10" stroke-width="11" stroke-dasharray="25 12"/>
    <line x1="70" y1="370" x2="360" y2="370" stroke="#311f10" stroke-width="11" stroke-dasharray="35 15"/>
    <line x1="100" y1="410" x2="390" y2="410" stroke="#311f10" stroke-width="11" stroke-dasharray="20 10"/>

    <!-- Mossy Top Lit Surface -->
    <path d="M 50,300 C 150,240 350,240 460,300 L 460,270 C 350,230 150,230 50,270 Z" fill="#5f8c2b" stroke="#1c1109" stroke-width="10"/>

    <!-- Sawn Log End (Right Side) -->
    <ellipse cx="430" cy="355" rx="30" ry="70" fill="#8c633a" stroke="#1c1109" stroke-width="11"/>
    <ellipse cx="430" cy="355" rx="20" ry="48" fill="none" stroke="#5c3f21" stroke-width="6"/>
    <ellipse cx="430" cy="355" rx="10" ry="24" fill="none" stroke="#5c3f21" stroke-width="6"/>

  </g>
</svg>