<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="215" ry="20" fill="#12131a" opacity="0.6"/>

    <!-- Low Iron Railing on Stone Kerb (y=210 to 450) -->
    <!-- Stone Kerb Base -->
    <polygon points="40,390 80,350 430,350 470,390" fill="#797f8c" stroke="#1b1c21" stroke-width="11" stroke-linejoin="round"/>
    <rect x="40" y="390" width="430" height="60" fill="#474a54" stroke="#1b1c21" stroke-width="11"/>

    <!-- Iron Posts -->
    <rect x="60" y="210" width="20" height="140" fill="#24262c" stroke="#121317" stroke-width="6"/>
    <rect x="430" y="210" width="20" height="140" fill="#24262c" stroke="#121317" stroke-width="6"/>
    <rect x="60" y="230" width="390" height="16" fill="#3a3d47" stroke="#121317" stroke-width="6"/>

    <!-- Pickets -->
    <path d="M 120,350 L 120,220 L 125,200 L 130,220 L 130,350 Z" fill="#24262c" stroke="#121317" stroke-width="5"/>
    <path d="M 180,350 L 180,220 L 185,200 L 190,220 L 190,350 Z" fill="#24262c" stroke="#121317" stroke-width="5"/>
    <path d="M 240,350 L 240,220 L 245,200 L 250,220 L 250,350 Z" fill="#24262c" stroke="#121317" stroke-width="5"/>
    <path d="M 300,350 L 300,220 L 305,200 L 310,220 L 310,350 Z" fill="#24262c" stroke="#121317" stroke-width="5"/>
    <path d="M 360,350 L 360,220 L 365,200 L 370,220 L 370,350 Z" fill="#24262c" stroke="#121317" stroke-width="5"/>

  </g>
</svg>