    <line x1="250" y1="280" x2="250" y2="450" stroke="#211308" stroke-width="8"/>
    <line x1="350" y1="280" x2="350" y2="450" stroke="#211308" stroke-width="8"/>

    <!-- Spoked Wheel -->
