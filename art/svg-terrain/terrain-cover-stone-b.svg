<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="205" ry="22" fill="#171324" opacity="0.6"/>

    <!-- Stacked sandbags: a soft, lumpy silhouette, which is about as far from
         a masonry wall's hard rectangle as a barricade can get. -->
    <!-- Back row (lit tops, seen from slightly above) -->
    <ellipse cx="120" cy="268" rx="82" ry="42" fill="#b39b6a" stroke="#2d2417" stroke-width="14"/>
    <ellipse cx="256" cy="258" rx="82" ry="42" fill="#c2a97a" stroke="#2d2417" stroke-width="14"/>
    <ellipse cx="392" cy="268" rx="82" ry="42" fill="#b39b6a" stroke="#2d2417" stroke-width="14"/>

    <!-- Front row, overlapping the seams behind it -->
    <ellipse cx="112" cy="360" rx="88" ry="46" fill="#9c8455" stroke="#2d2417" stroke-width="14"/>
    <ellipse cx="256" cy="372" rx="88" ry="46" fill="#8d7749" stroke="#2d2417" stroke-width="14"/>
    <ellipse cx="400" cy="360" rx="88" ry="46" fill="#9c8455" stroke="#2d2417" stroke-width="14"/>

    <!-- Base row, half-buried -->
    <ellipse cx="180" cy="434" rx="92" ry="40" fill="#7d6a41" stroke="#2d2417" stroke-width="14"/>
    <ellipse cx="336" cy="434" rx="92" ry="40" fill="#8d7749" stroke="#2d2417" stroke-width="14"/>

    <!-- Tied seams, so they read as bags rather than boulders -->
    <line x1="112" y1="322" x2="112" y2="346" stroke="#5f5133" stroke-width="11"/>
    <line x1="256" y1="334" x2="256" y2="358" stroke="#5f5133" stroke-width="11"/>
    <line x1="400" y1="322" x2="400" y2="346" stroke="#5f5133" stroke-width="11"/>

  </g>
</svg>