<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="210" ry="22" fill="#12131a" opacity="0.6"/>

    <!-- Low Stone Sarcophagus (y=230 to 450) -->
    <!-- Base Box -->
    <rect x="60" y="300" width="390" height="150" fill="#474a54" stroke="#1b1c21" stroke-width="13"/>
    <rect x="90" y="330" width="330" height="90" fill="#363840" stroke="#1b1c21" stroke-width="8"/>

    <!-- Pushed Aside Heavy Lid (Lit Top Surface) -->
    <polygon points="40,290 90,230 440,230 470,290" fill="#797f8c" stroke="#1b1c21" stroke-width="13" stroke-linejoin="round"/>
    <polygon points="90,230 440,230 455,275 75,275" fill="#a4aac7"/>

    <!-- Dark Interior Gap -->
    <rect x="70" y="290" width="370" height="15" fill="#121317"/>

  </g>
</svg>