<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop" transform="translate(256 256) scale(1.12) translate(-256 -256)">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="160" ry="24" fill="#12131a" opacity="0.6"/>

    <!-- Cracked Obelisk Spire -->
    <polygon points="256,40 170,140 340,140" fill="#797f8c" stroke="#1b1c21" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="256,40 170,140 256,140" fill="#a4aac7"/>

    <polygon points="170,140 340,140 360,450 150,450" fill="#474a54" stroke="#1b1c21" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="170,140 256,140 256,450 150,450" fill="#5d6270"/>

    <!-- Vertical Split Crack -->
