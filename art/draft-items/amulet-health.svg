<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="amulet-health-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <filter id="amulet-health-vitality-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="amulet-health-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#8d5600"/>
    </linearGradient>
    <linearGradient id="amulet-health-ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#5f0000"/>
    </linearGradient>
  </defs>
  <g filter="url(#amulet-health-shadow)">
    <!-- Chain Loop -->
    <path d="M 140,80 Q 256,240 372,80" fill="none" stroke="url(#amulet-health-gold)" stroke-width="8" stroke-dasharray="14,6" stroke-linecap="round"/>
    
    <!-- Amulet Gold Medallion Setting -->
    <circle cx="256" cy="290" r="65" fill="url(#amulet-health-gold)" stroke="#2a2333" stroke-width="6"/>
    <circle cx="256" cy="290" r="52" fill="#8d5600" stroke="#2a2333" stroke-width="4"/>

    <!-- Glowing Heart Ruby Gem -->
    <g filter="url(#amulet-health-vitality-glow)">
      <path d="M 256,260 C 236,235 206,255 226,285 L 256,325 L 286,285 C 306,255 276,235 256,260 Z" fill="url(#amulet-health-ruby)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>