<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="berserker-axe-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="berserker-axe-iron-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="50%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="berserker-axe-blood-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="berserker-axe-wood-haft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>
  </defs>
  <g filter="url(#berserker-axe-shadow)" transform="rotate(-45 256 256)">
    <!-- Wooden Haft -->
    <rect x="244" y="60" width="24" height="380" rx="8" fill="url(#berserker-axe-wood-haft)" stroke="#2a2333" stroke-width="5"/>
    
    <!-- Left Crescent Blade -->
    <path d="M 244,110 C 180,90 100,130 90,200 C 100,270 180,310 244,290 Z" fill="url(#berserker-axe-iron-head)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 90,200 C 100,270 180,310 244,290 L 235,260 C 190,270 120,240 115,200 Z" fill="url(#berserker-axe-blood-edge)"/>

    <!-- Right Crescent Blade -->
    <path d="M 268,110 C 332,90 412,130 422,200 C 412,270 332,310 268,290 Z" fill="url(#berserker-axe-iron-head)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 422,200 C 412,270 332,310 268,290 L 277,260 C 322,270 392,240 397,200 Z" fill="url(#berserker-axe-blood-edge)"/>

    <!-- Center Binding Ring -->
    <rect x="236" y="170" width="40" height="60" rx="4" fill="#37474f" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="200" r="10" fill="#d50000" stroke="#2a2333" stroke-width="2"/>

    <!-- Bottom Spike Pommel -->
    <polygon points="256,440 272,440 256,480 240,440" fill="url(#berserker-axe-iron-head)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>