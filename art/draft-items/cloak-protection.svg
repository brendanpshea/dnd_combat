<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="cloak-protection-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="cloak-protection-cloak-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <linearGradient id="cloak-protection-gold-trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#f5b324"/>
    </linearGradient>
  </defs>
  <g filter="url(#cloak-protection-shadow)">
    <!-- Hooded Heroic Cloak Fold -->
    <path d="M 210,90 C 230,70 282,70 302,90 C 340,110 400,200 420,380 C 430,440 370,440 330,420 C 290,400 220,400 182,420 C 142,440 82,440 92,380 C 112,200 172,110 210,90 Z" fill="url(#cloak-protection-cloak-blue)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Interior Fold Shadows -->
    <path d="M 210,90 C 230,150 220,300 200,410 C 240,390 272,390 312,410 C 292,300 282,150 302,90 Z" fill="#014375" opacity="0.6"/>

    <!-- Gold Brooch Clasp -->
    <circle cx="256" cy="115" r="22" fill="url(#cloak-protection-gold-trim)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="115" r="10" fill="#d50000" stroke="#2a2333" stroke-width="2"/>
    
    <!-- Gold Trim along collar -->
    <path d="M 210,90 Q 256,130 302,90" fill="none" stroke="url(#cloak-protection-gold-trim)" stroke-width="6"/>
  </g>
</svg>