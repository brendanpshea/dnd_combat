<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="giant-slayer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="giant-slayer-iron-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="60%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <linearGradient id="giant-slayer-iron-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>
    <linearGradient id="giant-slayer-rune-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <g filter="url(#giant-slayer-shadow)" transform="rotate(-45 256 256)">
    <!-- Massive Titan Blade -->
    <polygon points="256,30 290,230 256,255" fill="url(#giant-slayer-iron-light)"/>
    <polygon points="256,30 222,230 256,255" fill="url(#giant-slayer-iron-dark)"/>
    <!-- Giant Runes along fuller -->
    <line x1="256" y1="60" x2="256" y2="235" stroke="url(#giant-slayer-rune-blue)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="90" r="5" fill="#ffffff"/>
    <circle cx="256" cy="140" r="5" fill="#ffffff"/>
    <circle cx="256" cy="190" r="5" fill="#ffffff"/>

    <!-- Heavy Blocky Iron Guard -->
    <rect x="160" y="245" width="192" height="30" rx="6" fill="url(#giant-slayer-iron-dark)" stroke="#2a2333" stroke-width="5"/>
    <rect x="175" y="250" width="162" height="20" rx="3" fill="url(#giant-slayer-iron-light)" opacity="0.3"/>
    
    <!-- Two-handed Grip -->
    <rect x="244" y="275" width="24" height="120" rx="4" fill="#3e2723" stroke="#2a2333" stroke-width="5"/>
    <line x1="244" y1="300" x2="268" y2="300" stroke="#8d6e63" stroke-width="3"/>
    <line x1="244" y1="330" x2="268" y2="330" stroke="#8d6e63" stroke-width="3"/>
    <line x1="244" y1="360" x2="268" y2="360" stroke="#8d6e63" stroke-width="3"/>

    <!-- Square Heavy Iron Pommel -->
    <rect x="238" y="395" width="36" height="36" rx="6" fill="url(#giant-slayer-iron-dark)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="413" r="8" fill="url(#giant-slayer-rune-blue)" stroke="#2a2333" stroke-width="2"/>
    
    <!-- Outer Outline -->
    <polygon points="256,30 290,230 256,255 222,230" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>