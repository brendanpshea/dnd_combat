<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="cloak-displacement-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <filter id="cloak-displacement-displace-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="cloak-displacement-void-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="50%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
  </defs>
  <g filter="url(#cloak-displacement-shadow)">
    <!-- Echo / Displaced Silhouette Layer -->
    <path d="M 230,90 C 250,70 302,70 322,90 C 360,110 420,200 440,380 C 450,440 390,440 350,420 C 310,400 240,400 202,420 C 162,440 102,440 112,380 C 132,200 192,110 230,90 Z" fill="url(#cloak-displacement-void-purple)" opacity="0.4" filter="url(#cloak-displacement-displace-blur)"/>

    <!-- Primary Cloak Body -->
    <path d="M 200,90 C 220,70 272,70 292,90 C 330,110 390,200 410,380 C 420,440 360,440 320,420 C 280,400 210,400 172,420 C 132,440 72,440 82,380 C 102,200 162,110 200,90 Z" fill="url(#cloak-displacement-void-purple)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Ethereal Starry Dots -->
    <circle cx="210" cy="220" r="3" fill="#ea80fc"/>
    <circle cx="290" cy="280" r="4" fill="#ea80fc"/>
    <circle cx="180" cy="340" r="3" fill="#ea80fc"/>
    <circle cx="330" cy="180" r="3" fill="#ea80fc"/>
    
    <!-- Silver Moon Brooch -->
    <path d="M 246,105 A 14 14 0 1 0 266,125 A 10 10 0 1 1 246,105 Z" fill="#e0e0e0" stroke="#2a2333" stroke-width="3"/>
  </g>
</svg>