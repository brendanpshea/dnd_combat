<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="belt-giant-strength-hill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="belt-giant-strength-hill-girdle-leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>
    <linearGradient id="belt-giant-strength-hill-bronze-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#a75d00"/>
    </linearGradient>
  </defs>
  <g filter="url(#belt-giant-strength-hill-shadow)">
    <!-- Wide Heavy Leather Girdle Strap -->
    <rect x="60" y="190" width="392" height="132" rx="12" fill="url(#belt-giant-strength-hill-girdle-leather)" stroke="#2a2333" stroke-width="6"/>
    <line x1="60" y1="210" x2="452" y2="210" stroke="#ffb300" stroke-width="4" stroke-dasharray="12,8"/>
    <line x1="60" y1="302" x2="452" y2="302" stroke="#ffb300" stroke-width="4" stroke-dasharray="12,8"/>

    <!-- Massive Giant Buckle Plate -->
    <rect x="186" y="160" width="140" height="192" rx="16" fill="url(#belt-giant-strength-hill-bronze-plate)" stroke="#2a2333" stroke-width="6"/>
    
    <!-- Giant Face Motif on Buckle -->
    <circle cx="256" cy="230" r="30" fill="#3e2723" stroke="#2a2333" stroke-width="4"/>
    <circle cx="242" cy="225" r="5" fill="#ffb300"/>
    <circle cx="270" cy="225" r="5" fill="#ffb300"/>
    <rect x="240" y="248" width="32" height="6" fill="#ffb300"/>
    
    <!-- Corner Studs -->
    <circle cx="205" cy="180" r="8" fill="#5d4037" stroke="#2a2333" stroke-width="2"/>
    <circle cx="307" cy="180" r="8" fill="#5d4037" stroke="#2a2333" stroke-width="2"/>
    <circle cx="205" cy="332" r="8" fill="#5d4037" stroke="#2a2333" stroke-width="2"/>
    <circle cx="307" cy="332" r="8" fill="#5d4037" stroke="#2a2333" stroke-width="2"/>
  </g>
</svg>