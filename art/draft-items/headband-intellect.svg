<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="headband-intellect-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <filter id="headband-intellect-mind-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="headband-intellect-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <linearGradient id="headband-intellect-sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="50%" stop-color="#0091ea"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
  </defs>
  <g filter="url(#headband-intellect-shadow)">
    <!-- Arc Circlet Headband -->
    <path d="M 80,280 C 120,160 392,160 432,280 C 400,230 112,230 80,280 Z" fill="url(#headband-intellect-silver)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Central Brow Peak Ornament -->
    <path d="M 230,220 L 256,140 L 282,220 Z" fill="url(#headband-intellect-silver)" stroke="#2a2333" stroke-width="5"/>
    
    <!-- Glowing Sapphire Eye Gem -->
    <g filter="url(#headband-intellect-mind-glow)">
      <polygon points="256,160 274,195 256,230 238,195" fill="url(#headband-intellect-sapphire)" stroke="#2a2333" stroke-width="4"/>
      <polygon points="256,170 264,195 256,220 248,195" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>
</svg>