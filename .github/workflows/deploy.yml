name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Correctness gate only. The balance/sim harnesses (caster-variants,
      # arena, sim-ai) are slow, CPU-bound, and not what "can we ship" asks;
      # SKIP_SIMS leaves them out (see vitest.config.ts). They run nightly in
      # sims.yml instead, so a change never waits on thousands of battles to
      # reach production.
      - run: npm test
        env:
          SKIP_SIMS: '1'
      - run: npm run typecheck
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
