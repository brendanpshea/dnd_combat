<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1625" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>D&D Grid Combat</title>
    <!--
      The shell, inlined because it has to be on screen before anything is
      downloaded. The app is a single 244KB (gzipped) bundle over an empty
      #root: on a slow connection that is five seconds of white page, which
      reads as a dead link rather than as a game starting.

      Everything here is in the document, so it paints on the first byte. It is
      removed by the first React render — see main.tsx.
    -->
    <style>
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        gap: 14px; align-content: center; background: #1a1625; color: #d8cfe8;
        font-family: system-ui, sans-serif; text-align: center; z-index: 9999;
      }
      #boot b { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
      #boot span { font-size: 13px; color: #8d84a6; }
      #boot i {
        display: block; width: 120px; height: 3px; border-radius: 2px;
        background: #322b47; overflow: hidden;
      }
      #boot i::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 2px;
        background: #c69b2b; animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <!-- The name the app puts on its own landing screen, so the shell hands
           over to something that looks like the same product. -->
      <b>⚔️ The Free Company</b>
      <i></i>
      <span>Rolling initiative…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
