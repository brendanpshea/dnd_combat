<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop" transform="translate(256 256) scale(1.12) translate(-256 -256)">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="195" ry="24" fill="#17120e" opacity="0.6"/>

    <!-- Wooden Counter Base with Plank Lines & Shading -->
    <rect x="70" y="260" width="372" height="190" fill="#5c3d22" stroke="#211308" stroke-width="13"/>
    <!-- Vertical Wooden Planks -->
    <line x1="160" y1="260" x2="160" y2="450" stroke="#3b2413" stroke-width="8"/>
    <line x1="256" y1="260" x2="256" y2="450" stroke="#3b2413" stroke-width="8"/>
    <line x1="350" y1="260" x2="350" y2="450" stroke="#3b2413" stroke-width="8"/>

    <!-- Peaked Striped Canvas Awning -->
    <polygon points="256,50 40,170 472,170" fill="#3b2413"/>

    <!-- Striped Segments -->
    <polygon points="256,50 40,170 110,240 256,110" fill="#ab3c2e" stroke="#211308" stroke-width="10"/>
    <polygon points="256,50 110,240 180,240 256,110" fill="#e3d8c3" stroke="#211308" stroke-width="10"/>
    <polygon points="256,50 180,240 256,240 256,110" fill="#ab3c2e" stroke="#211308" stroke-width="10"/>
    <polygon points="256,50 256,240 330,240 256,110" fill="#e3d8c3" stroke="#211308" stroke-width="10"/>
    <polygon points="256,50 330,240 400,240 256,110" fill="#ab3c2e" stroke="#211308" stroke-width="10"/>
    <polygon points="256,50 400,240 472,170 256,110" fill="#e3d8c3" stroke="#211308" stroke-width="10"/>

  </g>
</svg>