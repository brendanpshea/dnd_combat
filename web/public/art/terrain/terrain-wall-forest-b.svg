    <path d="M 110,310 Q 80,230 130,170 Q 180,110 270,130 Q 370,150 380,250 Q 360,350 250,370 Z" fill="#36541b" stroke="#101b08" stroke-width="11"/>

    <!-- Lighter Yellow-Green Cluster on Left -->
