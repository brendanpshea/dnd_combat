<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="210" ry="22" fill="#171324" opacity="0.6"/>

    <!-- A timber palisade: warm wood against cold grey walls, so the two read
         apart by COLOUR before height even comes into it. -->
    <!-- Top rail (broad, lit, you could rest a crossbow on it) -->
    <polygon points="34,300 78,244 434,244 478,300" fill="#a9793f" stroke="#241a12" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="88,252 424,252 460,292 52,292" fill="#c99a58"/>

    <!-- Front face: upright staves, each with its own dark seam -->
    <rect x="34" y="300" width="444" height="150" rx="5" fill="#7a5530" stroke="#241a12" stroke-width="14"/>
    <rect x="52" y="300" width="66" height="150" fill="#8a613a" stroke="#3a2a1c" stroke-width="8"/>
    <rect x="140" y="300" width="66" height="150" fill="#6d4b2b" stroke="#3a2a1c" stroke-width="8"/>
    <rect x="228" y="300" width="66" height="150" fill="#8a613a" stroke="#3a2a1c" stroke-width="8"/>
    <rect x="316" y="300" width="66" height="150" fill="#6d4b2b" stroke="#3a2a1c" stroke-width="8"/>
    <rect x="404" y="300" width="60" height="150" fill="#8a613a" stroke="#3a2a1c" stroke-width="8"/>

    <!-- Iron binding strap across the middle -->
    <rect x="34" y="356" width="444" height="26" fill="#4a4458" stroke="#241a12" stroke-width="10"/>

  </g>
</svg>