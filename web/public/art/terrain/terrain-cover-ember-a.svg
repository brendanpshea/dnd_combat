<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="lava-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff4500" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffeb3b" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g id="terrain-prop" transform="translate(256 256) scale(1.12) translate(-256 -256)">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="210" ry="22" fill="#140a08" opacity="0.7"/>

    <!-- Low Ridge of Hardened Lava (y=230 to 450) -->
    <!-- Top Face -->
    <polygon points="40,290 90,230 420,230 470,290" fill="#3d373f" stroke="#121014" stroke-width="13" stroke-linejoin="round"/>

    <!-- Glowing Seams -->
    <g filter="url(#lava-glow)">
      <path d="M 90,250 L 180,270 L 260,240 L 370,280" stroke="#ff4500" stroke-width="13" fill="none"/>
      <path d="M 90,250 L 180,270 L 260,240 L 370,280" stroke="#ffeb3b" stroke-width="5" fill="none"/>
    </g>

    <!-- Front Face -->
    <rect x="40" y="290" width="430" height="160" rx="6" fill="#29252a" stroke="#121014" stroke-width="13"/>
    
    <!-- Base Glow -->
    <g filter="url(#lava-glow)">
      <line x1="40" y1="445" x2="470" y2="445" stroke="#ff4500" stroke-width="16"/>
    </g>

  </g>
</svg>