<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop" transform="translate(256 256) scale(1.12) translate(-256 -256)">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="190" ry="25" fill="#171324" opacity="0.6"/>

    <!-- Stone Wall Back Structure -->
    <path d="M 80,450 L 80,140 L 140,80 L 370,80 L 430,140 L 430,450 Z" fill="#474059" stroke="#1f1a29" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Top Face (Lit Stone) -->
    <polygon points="140,80 370,80 430,140 140,140" fill="#9e95ba" stroke="#1f1a29" stroke-width="13" stroke-linejoin="round"/>
    <polygon points="145,86 365,86 415,134 145,134" fill="#beb6d9"/>
    <line x1="140" y1="140" x2="430" y2="140" stroke="#1f1a29" stroke-width="13"/>

    <!-- Front Face (Masonry Block Courses) -->
    <path d="M 80,140 L 430,140 L 430,450 L 80,450 Z" fill="#69617d" stroke="#1f1a29" stroke-width="14" stroke-linejoin="round"/>

    <!-- Alternating Shaded Bricks -->
    <rect x="80" y="140" width="110" height="70" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>
    <rect x="190" y="140" x2="330" width="140" height="70" fill="#5e5670" stroke="#2a2338" stroke-width="8"/>
    <rect x="330" y="140" width="100" height="70" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>

    <rect x="80" y="210" width="160" height="80" fill="#5e5670" stroke="#2a2338" stroke-width="8"/>
    <rect x="240" y="210" width="190" height="80" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>

    <rect x="80" y="290" width="120" height="80" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>
    <rect x="200" y="290" width="150" height="80" fill="#5e5670" stroke="#2a2338" stroke-width="8"/>
    <rect x="350" y="290" width="80" height="80" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>

    <rect x="80" y="370" width="170" height="80" fill="#5e5670" stroke="#2a2338" stroke-width="8"/>
    <rect x="250" y="370" width="180" height="80" fill="#756c8c" stroke="#2a2338" stroke-width="8"/>

    <!-- Stone Cracks & Highlights -->
    <path d="M 120,180 L 140,230 L 130,260" stroke="#221b2e" stroke-width="6" fill="none"/>
    <path d="M 310,320 L 330,360 L 320,400" stroke="#221b2e" stroke-width="6" fill="none"/>

    <!-- Crumbled Corner Detail (Top Left) -->
    <polygon points="80,140 130,140 100,180 80,165" fill="#322b40" stroke="#1f1a29" stroke-width="8"/>

  </g>
</svg>