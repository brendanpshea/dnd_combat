<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g id="terrain-prop">

    <!-- Base Shadow -->
    <ellipse cx="256" cy="455" rx="215" ry="20" fill="#101c0c" opacity="0.6"/>

    <!-- Low Bramble & Deadfall Thicket (y=240 to 450) -->
    <rect x="60" y="340" width="390" height="90" rx="20" fill="#4a311b" stroke="#1c1109" stroke-width="11"/>
    <rect x="90" y="280" width="330" height="80" rx="18" fill="#5c3d22" stroke="#1c1109" stroke-width="11"/>

    <!-- Bristling Twigs -->
    <path d="M 70,280 L 50,210 M 120,280 L 110,200 M 200,280 L 210,190 M 280,280 L 270,195 M 360,280 L 380,205 M 430,280 L 450,220" stroke="#2b1a0d" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Mossy Top Edges -->
    <circle cx="150" cy="270" r="30" fill="#577827" stroke="#1c1109" stroke-width="8"/>
    <circle cx="310" cy="265" r="35" fill="#688c30" stroke="#1c1109" stroke-width="8"/>

  </g>
</svg>