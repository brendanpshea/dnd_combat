<svg xmlns="http://www.w3.org/2000/svg" viewBox="78.2 95.9 355.6 355.6" width="100%" height="100%">
  <defs>
    <filter id="studded-leather-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="studded-leather-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="studded-leather-leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="studded-leather-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- STUDDED LEATHER ARMOR (100% Transparent Background) -->
  <g filter="url(#studded-leather-drop-shadow)">
    <!-- Dark Studded Leather Body -->
    <path d="M 175,115 Q 256,130 337,115 L 395,185 L 345,220 L 325,190 L 325,425 Q 256,440 187,425 L 187,190 L 167,220 L 117,185 Z" fill="url(#studded-leather-leather-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Reinforced Steel Collar & Shoulder Trim -->
    <path d="M 175,115 Q 256,145 337,115 L 330,145 Q 256,165 182,145 Z" fill="url(#studded-leather-steel-rim)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 125,180 L 187,195 L 187,240 L 135,220 Z" fill="url(#studded-leather-steel-rim)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 387,180 L 325,195 L 325,240 L 377,220 Z" fill="url(#studded-leather-steel-rim)" stroke="#2a2333" stroke-width="4"/>
    <!-- Grid of Brass Studs/Rivets -->
    <g fill="url(#studded-leather-brass-grad)" stroke="#2a2333" stroke-width="2">
      <circle cx="215" cy="180" r="5.5"/><circle cx="256" cy="180" r="5.5"/><circle cx="297" cy="180" r="5.5"/>
      <circle cx="200" cy="225" r="5.5"/><circle cx="237" cy="225" r="5.5"/><circle cx="275" cy="225" r="5.5"/><circle cx="312" cy="225" r="5.5"/>
      <circle cx="215" cy="270" r="5.5"/><circle cx="256" cy="270" r="5.5"/><circle cx="297" cy="270" r="5.5"/>
      <circle cx="200" cy="315" r="5.5"/><circle cx="237" cy="315" r="5.5"/><circle cx="275" cy="315" r="5.5"/><circle cx="312" cy="315" r="5.5"/>
      <circle cx="215" cy="360" r="5.5"/><circle cx="256" cy="360" r="5.5"/><circle cx="297" cy="360" r="5.5"/>
      <circle cx="237" cy="400" r="5.5"/><circle cx="275" cy="400" r="5.5"/>
    </g>
  </g>
</svg>