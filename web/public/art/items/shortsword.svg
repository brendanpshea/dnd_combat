<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -27 520 520" data-ink="306" width="100%" height="100%">
  <defs>
    <filter id="shortsword-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="shortsword-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="shortsword-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="shortsword-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="shortsword-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="shortsword-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- SHORTSWORD (100% Transparent Background) -->
  <g filter="url(#shortsword-drop-shadow)" transform="rotate(-45 256 256)">
    <polygon points="256,90 240,300 256,300" fill="url(#shortsword-blade-light)"/>
    <polygon points="256,90 272,300 256,300" fill="url(#shortsword-blade-dark)"/>

    <line x1="256" y1="120" x2="256" y2="280" stroke="#2a2333" stroke-width="5" stroke-linecap="round"/>
    <line x1="255" y1="120" x2="255" y2="275" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Straight Crossguard -->
    <rect x="186" y="296" width="140" height="14" rx="4" fill="url(#shortsword-brass-grad)" stroke="#2a2333" stroke-width="4.5"/>
    <circle cx="256" cy="303" r="6" fill="#f5b324" stroke="#2a2333" stroke-width="2"/>
    <rect x="247" y="310" width="18" height="42" rx="3" fill="url(#shortsword-leather-grad)" stroke="#2a2333" stroke-width="5"/>
    
    <line x1="247" y1="322" x2="265" y2="322" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="338" x2="265" y2="338" stroke="#f5b324" stroke-width="2.5"/>
    <circle cx="256" cy="368" r="18" fill="url(#shortsword-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="368" r="8" fill="#d9910d" stroke="#2a2333" stroke-width="2"/>
    <circle cx="253" cy="365" r="2.5" fill="#ffffff"/>
    <polygon points="256,90 240,300 272,300" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,80 259,87 266,90 259,93 256,100 253,93 246,90 253,87" fill="#ffffff"/>
  </g>
</svg>