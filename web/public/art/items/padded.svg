<svg xmlns="http://www.w3.org/2000/svg" viewBox="83.8 101.5 344.4 344.4" width="100%" height="100%">
  <defs>
    <filter id="padded-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="padded-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="padded-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="padded-cloth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9b88f"/>
      <stop offset="50%" stop-color="#ab875a"/>
      <stop offset="100%" stop-color="#6e502c"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- PADDED ARMOR (100% Transparent Background) -->
  <g filter="url(#padded-drop-shadow)">
    <!-- Main Quilted Tunic Body -->
    <path d="M 170,120 Q 256,135 342,120 L 390,190 L 350,225 L 330,200 L 330,420 Q 256,435 182,420 L 182,200 L 162,225 L 122,190 Z" fill="url(#padded-cloth-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Collar & Neck Trim -->
    <path d="M 210,120 C 220,150 292,150 302,120 L 256,155 Z" fill="url(#padded-leather-grad)" stroke="#2a2333" stroke-width="4"/>
    <!-- Quilt Cross-Hatching Lines -->
    <path d="M 182,220 L 330,340 M 182,270 L 330,390 M 182,170 L 330,290 M 182,320 L 300,420" stroke="#241108" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
    <path d="M 330,220 L 182,340 M 330,270 L 182,390 M 330,170 L 182,290 M 330,320 L 212,420" stroke="#241108" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Center Placket & Brass Buttons -->
    <line x1="256" y1="155" x2="256" y2="425" stroke="#2a2333" stroke-width="4.5"/>
    <circle cx="256" cy="180" r="5" fill="url(#padded-brass-grad)" stroke="#2a2333" stroke-width="2"/>
    <circle cx="256" cy="230" r="5" fill="url(#padded-brass-grad)" stroke="#2a2333" stroke-width="2"/>
    <circle cx="256" cy="280" r="5" fill="url(#padded-brass-grad)" stroke="#2a2333" stroke-width="2"/>
    <circle cx="256" cy="330" r="5" fill="url(#padded-brass-grad)" stroke="#2a2333" stroke-width="2"/>
    <circle cx="256" cy="380" r="5" fill="url(#padded-brass-grad)" stroke="#2a2333" stroke-width="2"/>
  </g>
</svg>