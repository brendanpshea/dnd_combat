<svg xmlns="http://www.w3.org/2000/svg" viewBox="85.2 101.7 341.6 341.6" data-ink="305" width="100%" height="100%">
  <defs>
    <filter id="gauntlets-ogre-power-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="gauntlets-ogre-power-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#8d5600"/>
    </linearGradient>
    <linearGradient id="gauntlets-ogre-power-iron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>
  <g filter="url(#gauntlets-ogre-power-shadow)">
    <!-- Heavy Armored Plate Gauntlet -->
    <!-- Forearm cuff -->
    <path d="M 170,120 L 342,120 L 320,240 L 192,240 Z" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <rect x="200" y="140" width="112" height="24" rx="4" fill="url(#gauntlets-ogre-power-iron)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="190" r="14" fill="#b71c1c" stroke="#2a2333" stroke-width="3"/>

    <!-- Hand back plate -->
    <path d="M 192,245 L 320,245 L 310,340 L 202,340 Z" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Spiked Knuckle Guard -->
    <rect x="190" y="340" width="132" height="30" rx="6" fill="url(#gauntlets-ogre-power-iron)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="210,340 215,315 220,340" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="3"/>
    <polygon points="241,340 246,310 251,340" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="3"/>
    <polygon points="271,340 276,310 281,340" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="3"/>
    <polygon points="302,340 307,315 312,340" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="3"/>

    <!-- Fingers -->
    <rect x="200" y="370" width="22" height="45" rx="4" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="4"/>
    <rect x="228" y="370" width="24" height="55" rx="4" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="4"/>
    <rect x="258" y="370" width="24" height="55" rx="4" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="4"/>
    <rect x="288" y="370" width="22" height="45" rx="4" fill="url(#gauntlets-ogre-power-brass)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>