<svg xmlns="http://www.w3.org/2000/svg" viewBox="80.7 95.7 350.6 350.6" width="100%" height="100%">
  <defs>
    <filter id="leather-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="leather-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="leather-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="leather-leather-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5238"/>
      <stop offset="100%" stop-color="#5c3422"/>
    </linearGradient>

    <linearGradient id="leather-leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- LEATHER ARMOR (100% Transparent Background) -->
  <g filter="url(#leather-drop-shadow)">
    <!-- Leather Vest Body -->
    <path d="M 175,115 Q 256,130 337,115 L 395,185 L 345,220 L 325,190 L 325,420 C 290,430 222,430 187,420 L 187,190 L 167,220 L 117,185 Z" fill="url(#leather-leather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Padded Leather Pauldrons -->
    <path d="M 175,115 C 140,110 120,140 125,185 L 167,205 Z" fill="url(#leather-leather-light)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 337,115 C 372,110 392,140 387,185 L 345,205 Z" fill="url(#leather-leather-light)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Double Chest Harness Straps with Buckles -->
    <path d="M 150,150 L 340,240" stroke="url(#leather-leather-dark)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 150,150 L 340,240" stroke="#2a2333" stroke-width="3" fill="none"/>
    <path d="M 340,150 L 150,240" stroke="url(#leather-leather-dark)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 340,150 L 150,240" stroke="#2a2333" stroke-width="3" fill="none"/>
    <rect x="238" y="180" width="36" height="26" rx="4" fill="url(#leather-brass-grad)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="193" r="4" fill="#2a2333"/>
    <!-- Center Stitch Line & Waist Trim -->
    <line x1="256" y1="210" x2="256" y2="420" stroke="#f5b324" stroke-width="3.5" stroke-dasharray="8,5"/>
    <path d="M 187,360 Q 256,375 325,360" stroke="#2a2333" stroke-width="4.5" fill="none"/>
  </g>
</svg>