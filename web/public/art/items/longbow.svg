<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 -5 520 520" width="100%" height="100%">
  <defs>
    <filter id="longbow-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="longbow-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="longbow-horn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#8a735c"/>
    </linearGradient>

  </defs>
  <!-- LONGBOW (100% Transparent Background) -->
  <g filter="url(#longbow-drop-shadow)">
    <path d="M 80,40 C 230,70 380,140 420,280 C 445,360 460,420 450,470 C 430,460 395,380 365,280 C 315,160 180,100 80,40 Z" fill="url(#longbow-wood-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="80" cy="40" rx="10" ry="14" transform="rotate(-30 80 40)" fill="url(#longbow-horn-grad)" stroke="#2a2333" stroke-width="3"/>
    <ellipse cx="450" cy="470" rx="10" ry="14" transform="rotate(30 450 470)" fill="url(#longbow-horn-grad)" stroke="#2a2333" stroke-width="3"/>
    <path d="M 80,40 L 220,290 L 450,470" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 345,235 C 360,255 370,270 380,280 L 360,290 C 350,280 340,265 325,245 Z" fill="#3e2723" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>