<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34.6 -15 520 520" data-ink="370" width="100%" height="100%">
  <defs>
    <filter id="javelin-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="javelin-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="javelin-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="javelin-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="javelin-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <linearGradient id="javelin-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="70%" stop-color="#cc1133"/>
      <stop offset="100%" stop-color="#7a001e"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- JAVELIN (100% Transparent Background) -->
  <g filter="url(#javelin-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="249" y="170" width="14" height="260" rx="2" fill="url(#javelin-wood-grad)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 256,175 C 230,185 205,170 185,190 C 175,200 185,215 200,205 C 220,195 240,200 256,185 Z" fill="url(#javelin-ribbon-grad)" stroke="#2a2333" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="246,165 266,165 262,185 250,185" fill="url(#javelin-brass-grad)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 256,60 Q 235,115 246,165 L 256,165 Z" fill="url(#javelin-blade-light)"/>
    <path d="M 256,60 Q 277,115 266,165 L 256,165 Z" fill="url(#javelin-blade-dark)"/>
  </g>
</svg>