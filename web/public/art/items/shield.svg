<svg xmlns="http://www.w3.org/2000/svg" viewBox="37.6 36.6 436.8 436.8" width="100%" height="100%">
  <defs>
    <filter id="shield-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="shield-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="shield-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

    <linearGradient id="shield-shield-field-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a52be"/>
      <stop offset="100%" stop-color="#142866"/>
    </linearGradient>

    <linearGradient id="shield-shield-field-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d93838"/>
      <stop offset="100%" stop-color="#731414"/>
    </linearGradient>

  </defs>
  <!-- SHIELD (100% Transparent Background) -->
  <g filter="url(#shield-drop-shadow)">
    <path d="M 256,60 L 390,95 C 390,260 360,370 256,450 C 152,370 122,260 122,95 Z" fill="url(#shield-steel-rim)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 256,80 L 142,110 C 142,245 165,345 256,424 Z" fill="url(#shield-shield-field-left)"/>
    <path d="M 256,80 L 370,110 C 370,245 347,345 256,424 Z" fill="url(#shield-shield-field-right)"/>
    <g transform="translate(256, 220)">
      <path d="M 0,-55 L 8,-35 L 25,-45 L 18,-25 L 40,-25 L 25,-8 L 45,0 L 25,8 L 40,25 L 18,25 L 25,45 L 8,35 L 0,55 L -8,35 L -25,45 L -18,25 L -40,25 L -25,8 L -45,0 L -25,-8 L -40,-25 L -18,-25 L -25,-45 L -8,-35 Z" fill="url(#shield-gold-grad)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>