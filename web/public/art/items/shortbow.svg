    <line x1="165" y1="325" x2="390" y2="100" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
    <polygon points="390,100 425,65 405,115" fill="#cfd8dc" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
