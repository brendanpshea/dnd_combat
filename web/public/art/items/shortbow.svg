    <path d="M 120,80 C 240,110 370,160 400,280 C 420,350 440,380 430,410 C 410,400 380,340 350,270 C 310,180 200,140 120,80 Z" fill="url(#shortbow-wood-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
