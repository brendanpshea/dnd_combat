<svg xmlns="http://www.w3.org/2000/svg" viewBox="83.1 44.3 386.4 386.4" width="100%" height="100%">
  <defs>
    <filter id="shortbow-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="shortbow-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

