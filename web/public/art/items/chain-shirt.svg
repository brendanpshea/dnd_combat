<svg xmlns="http://www.w3.org/2000/svg" viewBox="83.8 96.5 344.4 344.4" width="100%" height="100%">
  <defs>
    <filter id="chain-shirt-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="chain-shirt-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="chain-shirt-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- CHAIN SHIRT (100% Transparent Background) -->
  <g filter="url(#chain-shirt-drop-shadow)">
    <!-- Metallic Chainmail Shirt Body -->
    <path d="M 175,115 Q 256,130 337,115 L 405,185 L 355,235 L 325,195 L 325,415 Q 256,430 187,415 L 187,195 L 157,235 L 107,185 Z" fill="url(#chain-shirt-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Chain Ring Mesh Rows Pattern -->
    <g fill="none" stroke="#354457" stroke-width="3" opacity="0.65">
      <path d="M 140,165 Q 256,190 372,165 M 130,195 Q 256,220 382,195 M 187,225 Q 256,245 325,225 M 187,255 Q 256,275 325,255 M 187,285 Q 256,305 325,285 M 187,315 Q 256,335 325,315 M 187,345 Q 256,365 325,345 M 187,375 Q 256,395 325,375"/>
    </g>
    <!-- Leather Trim Edges -->
    <path d="M 175,115 Q 256,140 337,115 L 330,135 Q 256,155 182,135 Z" fill="url(#chain-shirt-leather-grad)" stroke="#2a2333" stroke-width="4"/>
    <path d="M 187,400 Q 256,415 325,400 L 325,415 Q 256,430 187,415 Z" fill="url(#chain-shirt-leather-grad)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>