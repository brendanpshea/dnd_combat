<svg xmlns="http://www.w3.org/2000/svg" viewBox="71.7 95.6 300.5 300.5" width="100%" height="100%">
  <defs>
    <filter id="handaxe-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="handaxe-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="handaxe-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="handaxe-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- HANDAXE (100% Transparent Background) -->
  <g filter="url(#handaxe-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="248" y="120" width="16" height="260" rx="3" fill="url(#handaxe-wood-grad)" stroke="#2a2333" stroke-width="4.5"/>
    <path d="M 248,125 Q 160,85 150,165 Q 160,245 248,205 Z" fill="url(#handaxe-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="264" y="140" width="30" height="50" rx="2" fill="url(#handaxe-blade-dark)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <rect x="242" y="130" width="28" height="70" rx="3" fill="#37474f" stroke="#2a2333" stroke-width="4.5"/>
  </g>
</svg>