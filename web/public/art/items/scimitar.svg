<svg xmlns="http://www.w3.org/2000/svg" viewBox="43.5 30 374.1 374.1" width="100%" height="100%">
  <defs>
    <filter id="scimitar-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="scimitar-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="scimitar-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="scimitar-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- SCIMITAR (100% Transparent Background) -->
  <g filter="url(#scimitar-drop-shadow)" transform="rotate(-45 256 256)">
    <!-- Curved Single-Edged Blade -->
    <path d="M 256,50 C 230,120 200,200 240,300 L 256,300 C 265,220 280,140 256,50 Z" fill="url(#scimitar-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 256,50 C 245,120 225,200 248,300 Z" fill="#ffffff" opacity="0.4"/>
    
    <!-- Brass Knuckle Guard & Quillon -->
    <path d="M 240,298 C 180,290 170,350 240,360 Z" fill="url(#scimitar-brass-grad)" stroke="#2a2333" stroke-width="4.5"/>
    <rect x="220" y="295" width="50" height="12" rx="3" fill="url(#scimitar-brass-grad)" stroke="#2a2333" stroke-width="4.5"/>
    
    <!-- Curved Single-Hand Grip -->
    <rect x="247" y="307" width="16" height="48" rx="3" fill="url(#scimitar-wood-grad)" stroke="#2a2333" stroke-width="4.5"/>
    
    <!-- Brass Pommel Ring -->
    <circle cx="255" cy="370" r="14" fill="url(#scimitar-brass-grad)" stroke="#2a2333" stroke-width="4.5"/>
  </g>
</svg>