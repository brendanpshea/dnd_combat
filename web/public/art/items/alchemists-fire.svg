<svg xmlns="http://www.w3.org/2000/svg" viewBox="82.4 81.4 347.2 347.2" width="100%" height="100%">
  <defs>
    <filter id="alchemists-fire-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="alchemists-fire-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="alchemists-fire-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <radialGradient id="alchemists-fire-fire-liquid" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="35%" stop-color="#ffb74d"/>
      <stop offset="70%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>

  </defs>
  <!-- ALCHEMIST'S FIRE (100% Transparent Background) -->
  <g filter="url(#alchemists-fire-drop-shadow)">
    <polygon points="236,100 276,100 270,135 242,135" fill="url(#alchemists-fire-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,130 330,175 375,275 335,410 177,410 137,275 182,175" fill="#1f1828" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="256,145 320,185 362,275 328,398 184,398 148,275 192,185" fill="url(#alchemists-fire-fire-liquid)"/>
    <g stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round">
      <line x1="256" y1="130" x2="256" y2="410" stroke="url(#alchemists-fire-brass-grad)" stroke-width="7"/>
      <path d="M 137,275 Q 256,300 375,275" fill="none" stroke="url(#alchemists-fire-brass-grad)" stroke-width="7"/>
    </g>
  </g>
</svg>