<svg xmlns="http://www.w3.org/2000/svg" viewBox="78.2 95.9 355.6 355.6" width="100%" height="100%">
  <defs>
    <filter id="ring-mail-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="ring-mail-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="ring-mail-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="ring-mail-leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="ring-mail-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- RING MAIL (100% Transparent Background) -->
  <g filter="url(#ring-mail-drop-shadow)">
    <!-- Heavy Leather Tunic -->
    <path d="M 175,115 Q 256,130 337,115 L 405,185 L 355,235 L 325,195 L 325,425 Q 256,440 187,425 L 187,195 L 157,235 L 107,185 Z" fill="url(#ring-mail-leather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Large Sewn Metallic Rings -->
    <g fill="none" stroke="url(#ring-mail-steel-rim)" stroke-width="4.5" filter="drop-shadow(0px 2px 2px #2a2333)">
      <circle cx="215" cy="175" r="14"/><circle cx="256" cy="175" r="14"/><circle cx="297" cy="175" r="14"/>
      <circle cx="200" cy="220" r="14"/><circle cx="237" cy="220" r="14"/><circle cx="275" cy="220" r="14"/><circle cx="312" cy="220" r="14"/>
      <circle cx="215" cy="265" r="14"/><circle cx="256" cy="265" r="14"/><circle cx="297" cy="265" r="14"/>
      <circle cx="200" cy="310" r="14"/><circle cx="237" cy="310" r="14"/><circle cx="275" cy="310" r="14"/><circle cx="312" cy="310" r="14"/>
      <circle cx="215" cy="355" r="14"/><circle cx="256" cy="355" r="14"/><circle cx="297" cy="355" r="14"/>
      <circle cx="237" cy="395" r="14"/><circle cx="275" cy="395" r="14"/>
    </g>
    <!-- Heavy Belt & Buckle -->
    <path d="M 187,315 Q 256,330 325,315" stroke="url(#ring-mail-leather-dark)" stroke-width="14" fill="none"/>
    <rect x="238" y="307" width="36" height="26" rx="4" fill="url(#ring-mail-brass-grad)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>