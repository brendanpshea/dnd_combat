<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 55.8 405.9 405.9" width="100%" height="100%">
  <defs>
    <filter id="hide-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="hide-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="hide-fur-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0d7cd"/>
      <stop offset="60%" stop-color="#998777"/>
      <stop offset="100%" stop-color="#4d4136"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="hide-horn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#8a735c"/>
    </linearGradient>

  </defs>
  <!-- HIDE ARMOR (100% Transparent Background) -->
  <g filter="url(#hide-drop-shadow)">
    <!-- Jagged Raw Leather Body -->
    <path d="M 170,120 Q 256,135 342,120 L 390,180 L 350,225 L 325,195 L 330,410 L 300,435 L 270,415 L 240,440 L 210,415 L 182,430 L 187,195 L 162,225 L 122,180 Z" fill="url(#hide-leather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Fur Mantle Collar -->
    <path d="M 155,120 C 130,90 200,60 256,90 C 312,60 382,90 357,120 C 390,155 350,195 325,170 C 300,200 212,200 187,170 C 162,195 122,155 155,120 Z" fill="url(#hide-fur-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Raw Horn Fastener Buttons -->
    <polygon points="215,160 235,145 225,175" fill="url(#hide-horn-grad)" stroke="#2a2333" stroke-width="3"/>
    <polygon points="297,160 277,145 287,175" fill="url(#hide-horn-grad)" stroke="#2a2333" stroke-width="3"/>
    <!-- Heavy Leather Cross-Stitches -->
    <path d="M 210,240 L 230,260 M 230,240 L 210,260" stroke="#f5b324" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 282,240 L 302,260 M 302,240 L 282,260" stroke="#f5b324" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 246,310 L 266,330 M 266,310 L 246,330" stroke="#f5b324" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>