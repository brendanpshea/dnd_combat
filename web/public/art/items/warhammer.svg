<svg xmlns="http://www.w3.org/2000/svg" viewBox="81.1 96.1 352.8 352.8" width="100%" height="100%">
  <defs>
    <filter id="warhammer-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="warhammer-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="warhammer-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="warhammer-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="warhammer-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- WARHAMMER (100% Transparent Background) -->
  <g filter="url(#warhammer-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="120" width="18" height="310" rx="3" fill="url(#warhammer-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="247,120 160,145 247,170" fill="url(#warhammer-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="265,120 355,120 355,170 265,170" fill="url(#warhammer-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="240" y="115" width="32" height="60" rx="3" fill="url(#warhammer-gold-grad)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>