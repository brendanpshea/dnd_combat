<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -22.5 520 520" data-ink="385" width="100%" height="100%">
  <defs>
    <filter id="greataxe-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="greataxe-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="greataxe-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="greataxe-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- GREATAXE (100% Transparent Background) -->
  <g filter="url(#greataxe-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="110" width="18" height="320" rx="3" fill="url(#greataxe-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="256,45 264,110 248,110" fill="url(#greataxe-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 247,115 Q 120,70 120,165 Q 120,260 247,215 Z" fill="url(#greataxe-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 265,115 Q 392,70 392,165 Q 392,260 265,215 Z" fill="url(#greataxe-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="242" y="125" width="28" height="80" rx="4" fill="#354457" stroke="#2a2333" stroke-width="5"/>
  </g>
</svg>