<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.4 -3.6 441.3 441.3" width="100%" height="100%">
  <defs>
    <filter id="greatsword-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="greatsword-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="greatsword-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="greatsword-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="greatsword-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- GREATSWORD (100% Transparent Background) -->
  <g filter="url(#greatsword-drop-shadow)" transform="rotate(-45 256 256)">
    <polygon points="256,30 226,275 256,275" fill="url(#greatsword-blade-light)"/>
    <polygon points="256,30 286,275 256,275" fill="url(#greatsword-blade-dark)"/>

    <!-- Ricasso Lugs -->
    <polygon points="226,230 202,240 226,255" fill="url(#greatsword-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="286,230 310,240 286,255" fill="url(#greatsword-blade-dark)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <line x1="256" y1="60" x2="256" y2="255" stroke="#2a2333" stroke-width="5" stroke-linecap="round"/>
    <line x1="255" y1="60" x2="255" y2="250" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Winged Crossguard -->
    <path d="M 256,270 L 345,240 L 360,255 L 320,285 L 256,290 L 192,285 L 152,255 L 167,240 Z" fill="url(#greatsword-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,263 268,280 256,297 244,280" fill="url(#greatsword-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="280" r="5" fill="#e60039" stroke="#2a2333" stroke-width="2"/>
    <rect x="247" y="290" width="18" height="90" rx="3" fill="url(#greatsword-leather-grad)" stroke="#2a2333" stroke-width="5"/>
    
    <line x1="247" y1="302" x2="265" y2="302" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="318" x2="265" y2="318" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="334" x2="265" y2="334" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="350" x2="265" y2="350" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="366" x2="265" y2="366" stroke="#f5b324" stroke-width="2.5"/>
    <circle cx="256" cy="396" r="18" fill="url(#greatsword-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="396" r="8" fill="#d9910d" stroke="#2a2333" stroke-width="2"/>
    <circle cx="253" cy="393" r="2.5" fill="#ffffff"/>
    <polygon points="256,30 226,275 286,275" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,20 259,27 266,30 259,33 256,40 253,33 246,30 253,27" fill="#ffffff"/>
  </g>
</svg>