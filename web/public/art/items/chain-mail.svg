<svg xmlns="http://www.w3.org/2000/svg" viewBox="55.5 75.8 401 401" data-ink="358" width="100%" height="100%">
  <defs>
    <filter id="chain-mail-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="chain-mail-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="chain-mail-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="chain-mail-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- CHAIN MAIL (100% Transparent Background) -->
  <g filter="url(#chain-mail-drop-shadow)">
    <!-- Full Heavy Chainmail Hauberk Body with Long Sleeves -->
    <path d="M 170,110 Q 256,125 342,110 L 435,175 L 375,250 L 325,200 L 325,435 Q 256,450 187,435 L 187,200 L 137,250 L 77,175 Z" fill="url(#chain-mail-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Interlocked Chain Ring Shading Overlay -->
    <g fill="none" stroke="#4e6278" stroke-width="3" opacity="0.6">
      <path d="M 110,165 Q 256,190 402,165 M 100,195 Q 256,220 412,195 M 187,225 Q 256,245 325,225 M 187,255 Q 256,275 325,255 M 187,285 Q 256,305 325,285 M 187,315 Q 256,335 325,315 M 187,345 Q 256,365 325,345 M 187,375 Q 256,395 325,375 M 187,405 Q 256,425 325,405"/>
    </g>
    <!-- Coif / Draped Mail Hood Collar -->
    <path d="M 195,110 C 210,160 302,160 317,110 C 340,150 172,150 195,110 Z" fill="url(#chain-mail-steel-rim)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Heavy Waist Belt with Steel Buckle -->
    <path d="M 187,320 Q 256,335 325,320" stroke="url(#chain-mail-leather-grad)" stroke-width="14" fill="none"/>
    <rect x="238" y="312" width="36" height="26" rx="4" fill="url(#chain-mail-steel-rim)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="325" r="4" fill="#2a2333"/>
  </g>
</svg>