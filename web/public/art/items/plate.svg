<svg xmlns="http://www.w3.org/2000/svg" viewBox="70.3 93.5 371.4 371.4" width="100%" height="100%">
  <defs>
    <filter id="plate-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="plate-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="plate-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="plate-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- FULL PLATE ARMOR (100% Transparent Background) -->
  <g filter="url(#plate-drop-shadow)">
    <!-- Layered Massive Pauldrons (Shoulder Guards) -->
    <path d="M 105,170 C 130,95 200,105 210,140 L 190,230 L 120,230 Z" fill="url(#plate-steel-rim)" stroke="#2a2333" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 407,170 C 382,95 312,105 302,140 L 322,230 L 392,230 Z" fill="url(#plate-steel-rim)" stroke="#2a2333" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 115,190 L 195,195 L 185,240 L 125,235 Z" fill="url(#plate-blade-light)" stroke="#2a2333" stroke-width="4.5"/>
    <path d="M 397,190 L 317,195 L 327,240 L 387,235 Z" fill="url(#plate-blade-light)" stroke="#2a2333" stroke-width="4.5"/>

    <!-- Gorget / High Neck Collar -->
    <path d="M 195,115 C 220,145 292,145 317,115 L 302,150 C 275,170 237,170 210,150 Z" fill="url(#plate-steel-rim)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>

    <!-- Main Knightly Breastplate -->
    <path d="M 190,145 Q 256,160 322,145 C 360,200 345,280 330,335 C 310,405 285,435 256,445 C 227,435 202,405 182,335 C 167,280 152,200 190,145 Z" fill="url(#plate-steel-rim)" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 256,160 L 190,145 C 152,200 167,280 182,335 C 202,405 227,435 256,445 Z" fill="url(#plate-blade-light)" opacity="0.55"/>
    <line x1="256" y1="160" x2="256" y2="445" stroke="#ffffff" stroke-width="4.5"/>
    <line x1="256" y1="160" x2="256" y2="445" stroke="#2a2333" stroke-width="2.5"/>

    <!-- Gold Filigree & Knight Crest -->
    <path d="M 190,145 Q 256,170 322,145" stroke="url(#plate-gold-grad)" stroke-width="7" fill="none"/>
    <path d="M 190,145 Q 256,170 322,145" stroke="#2a2333" stroke-width="3" fill="none"/>
    <g transform="translate(256, 240)">
      <polygon points="0,-25 22,0 0,25 -22,0" fill="url(#plate-gold-grad)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="8" fill="#9be2ff" stroke="#2a2333" stroke-width="2.5"/>
    </g>
    <!-- Flared Tassets / Belt Guard -->
    <path d="M 182,335 Q 256,355 330,335 L 340,365 Q 256,385 172,365 Z" fill="url(#plate-gold-grad)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>