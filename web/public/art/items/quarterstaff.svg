<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.4 25.4 459.2 459.2" width="100%" height="100%">
  <defs>
    <filter id="quarterstaff-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="quarterstaff-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="quarterstaff-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- QUARTERSTAFF (100% Transparent Background) -->
  <g filter="url(#quarterstaff-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="50" width="18" height="410" rx="4" fill="url(#quarterstaff-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <rect x="245" y="50" width="22" height="35" rx="3" fill="url(#quarterstaff-blade-dark)" stroke="#2a2333" stroke-width="4"/>
    <rect x="245" y="425" width="22" height="35" rx="3" fill="url(#quarterstaff-blade-dark)" stroke="#2a2333" stroke-width="4"/>
    <g fill="#37474f" stroke="#2a2333" stroke-width="3">
      <rect x="246" y="210" width="20" height="92" rx="2"/>
      <line x1="246" y1="233" x2="266" y2="233" stroke="#ffe875" stroke-width="2.5"/>
      <line x1="246" y1="256" x2="266" y2="256" stroke="#ffe875" stroke-width="2.5"/>
      <line x1="246" y1="279" x2="266" y2="279" stroke="#ffe875" stroke-width="2.5"/>
    </g>
  </g>
</svg>