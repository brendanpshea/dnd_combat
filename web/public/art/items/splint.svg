<svg xmlns="http://www.w3.org/2000/svg" viewBox="75.4 95.6 361.2 361.2" width="100%" height="100%">
  <defs>
    <filter id="splint-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="splint-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="splint-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="splint-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <linearGradient id="splint-leather-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2014"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="splint-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- SPLINT ARMOR (100% Transparent Background) -->
  <g filter="url(#splint-drop-shadow)">
    <!-- Heavy Leather Foundation Tunic -->
    <path d="M 175,115 Q 256,130 337,115 L 395,185 L 345,220 L 325,190 L 325,430 Q 256,445 187,430 L 187,190 L 167,220 L 117,185 Z" fill="url(#splint-leather-dark)" stroke="#2a2333" stroke-width="5"/>
    <!-- Vertical Steel Splint Slats (Torso) -->
    <g fill="url(#splint-steel-rim)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round">
      <rect x="192" y="160" width="20" height="250" rx="3"/>
      <rect x="218" y="165" width="20" height="250" rx="3"/>
      <rect x="246" y="170" width="20" height="250" rx="3"/>
      <rect x="274" y="165" width="20" height="250" rx="3"/>
      <rect x="300" y="160" width="20" height="250" rx="3"/>
    </g>
    <!-- Horizontal Cross-Straps & Rivets -->
    <path d="M 187,220 Q 256,235 325,220 M 187,320 Q 256,335 325,320" stroke="url(#splint-leather-grad)" stroke-width="8" stroke-linecap="round"/>
    <g fill="url(#splint-brass-grad)" stroke="#2a2333" stroke-width="1.5">
      <circle cx="202" cy="220" r="3.5"/><circle cx="228" cy="222" r="3.5"/><circle cx="256" cy="223" r="3.5"/><circle cx="284" cy="222" r="3.5"/><circle cx="310" cy="220" r="3.5"/>
      <circle cx="202" cy="320" r="3.5"/><circle cx="228" cy="322" r="3.5"/><circle cx="256" cy="323" r="3.5"/><circle cx="284" cy="322" r="3.5"/><circle cx="310" cy="320" r="3.5"/>
    </g>
    <!-- Steel Pauldrons -->
    <path d="M 120,180 L 185,190 L 175,130 Z" fill="url(#splint-blade-light)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 392,180 L 327,190 L 337,130 Z" fill="url(#splint-blade-light)" stroke="#2a2333" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>