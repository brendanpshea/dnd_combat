<svg xmlns="http://www.w3.org/2000/svg" viewBox="107.6 124.1 296.8 296.8" data-ink="265" width="100%" height="100%">
  <defs>
    <filter id="gloves-thievery-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="gloves-thievery-dark-leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="50%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gloves-thievery-silver-trim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
  </defs>
  <g filter="url(#gloves-thievery-shadow)">
    <!-- Sleek Thief Glove Cuff -->
    <path d="M 180,140 L 332,140 L 315,250 L 197,250 Z" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 180,140 L 332,140 L 328,160 L 184,160 Z" fill="url(#gloves-thievery-silver-trim)"/>

    <!-- Lockpick / Keyhole Emblem -->
    <circle cx="256" cy="200" r="16" fill="none" stroke="url(#gloves-thievery-silver-trim)" stroke-width="4"/>
    <polygon points="256,200 250,225 262,225" fill="url(#gloves-thievery-silver-trim)"/>

    <!-- Hand & Palm -->
    <path d="M 197,255 L 315,255 L 305,340 L 207,340 Z" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>

    <!-- Fingerless / Reinforced Fingertips -->
    <rect x="202" y="340" width="22" height="50" rx="4" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="4"/>
    <rect x="230" y="340" width="22" height="65" rx="4" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="4"/>
    <rect x="258" y="340" width="22" height="65" rx="4" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="4"/>
    <rect x="286" y="340" width="22" height="50" rx="4" fill="url(#gloves-thievery-dark-leather)" stroke="#2a2333" stroke-width="4"/>
    
    <!-- Silver Lockpick Fingertip Accents -->
    <circle cx="241" cy="395" r="4" fill="#00e676"/>
    <circle cx="269" cy="395" r="4" fill="#00e676"/>
  </g>
</svg>