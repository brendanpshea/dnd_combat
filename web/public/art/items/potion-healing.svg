<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.7 61.7 378.6 378.6" width="100%" height="100%">
  <defs>
    <filter id="potion-healing-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="potion-healing-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <!-- Liquid Gradients -->
    <radialGradient id="potion-healing-liquid-red" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="50%" stop-color="#ff1a40"/>
      <stop offset="90%" stop-color="#b30024"/>
      <stop offset="100%" stop-color="#660012"/>
    </radialGradient>

    <linearGradient id="potion-healing-glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="potion-healing-cork-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9915c"/>
      <stop offset="100%" stop-color="#7a4e28"/>
    </linearGradient>

  </defs>
  <!-- POTION OF HEALING (100% Transparent Background) -->
  <g filter="url(#potion-healing-drop-shadow)">
    <path d="M 226,90 L 286,90 L 280,130 L 232,130 Z" fill="url(#potion-healing-cork-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="256" cy="90" rx="30" ry="8" fill="#dfaa73" stroke="#2a2333" stroke-width="4"/>
    <path d="M 220,126 C 220,126 215,165 195,190 C 175,215 130,240 130,300 C 130,380 185,420 256,420 C 327,420 382,380 382,300 C 382,240 337,215 317,190 C 297,165 292,126 292,126 Z" fill="#1e2936" stroke="#2a2333" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 142,310 C 142,375 190,408 256,408 C 322,408 370,375 370,310 C 370,265 330,245 310,225 C 295,210 290,190 290,190 L 222,190 C 222,190 217,210 202,225 C 182,245 142,265 142,310 Z" fill="url(#potion-healing-liquid-red)"/>
    <ellipse cx="256" cy="235" rx="52" ry="14" fill="#ff809b" opacity="0.8"/>
    <circle cx="230" cy="330" r="14" fill="#ffb3c1" opacity="0.7"/>
    <g transform="translate(256, 320)" stroke="#2a2333" stroke-width="3.5">
      <path d="M -10,-24 L 10,-24 L 10,-10 L 24,-10 L 24,10 L 10,10 L 10,24 L -10,24 L -10,10 L -24,10 L -24,-10 L -10,-10 Z" fill="url(#potion-healing-gold-grad)"/>
    </g>
    <path d="M 160,265 Q 148,300 155,340 C 160,365 175,388 200,400" fill="none" stroke="url(#potion-healing-glass-shine)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>