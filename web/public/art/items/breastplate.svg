<svg xmlns="http://www.w3.org/2000/svg" viewBox="69 86 374 374" data-ink="333.9" width="100%" height="100%">
  <defs>
    <filter id="breastplate-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="breastplate-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="breastplate-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="breastplate-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="breastplate-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="breastplate-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

  </defs>
  <!-- BREASTPLATE (100% Transparent Background) -->
  <g filter="url(#breastplate-drop-shadow)">
    <!-- Main Polished Steel Cuirass -->
    <path d="M 180,120 Q 256,135 332,120 C 375,160 355,250 340,310 C 320,390 290,430 256,440 C 222,430 192,390 172,310 C 157,250 137,160 180,120 Z" fill="url(#breastplate-steel-rim)" stroke="#2a2333" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 256,135 L 180,120 C 137,160 157,250 172,310 C 192,390 222,430 256,440 Z" fill="url(#breastplate-blade-light)" opacity="0.6"/>
    <!-- Prominent Center Median Ridge -->
    <path d="M 256,135 L 256,440" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 256,135 L 256,440" stroke="#2a2333" stroke-width="2" stroke-linecap="round"/>
    <!-- Gold / Brass Trim & Embellishments -->
    <path d="M 180,120 Q 256,145 332,120" stroke="url(#breastplate-gold-grad)" stroke-width="7" fill="none"/>
    <path d="M 180,120 Q 256,145 332,120" stroke="#2a2333" stroke-width="3" fill="none"/>
    <path d="M 172,310 Q 256,335 340,310" stroke="url(#breastplate-gold-grad)" stroke-width="6" fill="none"/>
    <!-- Shoulder Leather Straps -->
    <rect x="150" y="110" width="30" height="40" rx="3" fill="url(#breastplate-leather-grad)" stroke="#2a2333" stroke-width="4" transform="rotate(-20 165 130)"/>
    <rect x="332" y="110" width="30" height="40" rx="3" fill="url(#breastplate-leather-grad)" stroke="#2a2333" stroke-width="4" transform="rotate(20 347 130)"/>
    <circle cx="168" cy="135" r="4" fill="url(#breastplate-brass-grad)"/>
    <circle cx="344" cy="135" r="4" fill="url(#breastplate-brass-grad)"/>
  </g>
</svg>