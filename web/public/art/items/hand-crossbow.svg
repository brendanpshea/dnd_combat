<svg xmlns="http://www.w3.org/2000/svg" viewBox="21.2 -6.8 469.7 469.7" data-ink="260" width="100%" height="100%">
  <defs>
    <filter id="hand-crossbow-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="hand-crossbow-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="hand-crossbow-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="hand-crossbow-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="hand-crossbow-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <linearGradient id="hand-crossbow-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

    <linearGradient id="hand-crossbow-steel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaeff5"/>
      <stop offset="50%" stop-color="#b0c2d4"/>
      <stop offset="100%" stop-color="#5a6e85"/>
    </linearGradient>

    <linearGradient id="hand-crossbow-feather-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
  </defs>
  <!-- HAND CROSSBOW (100% Transparent Background) -->
  <g filter="url(#hand-crossbow-drop-shadow)">
    <!-- Bow limbs: thin springy arcs, outline drawn first then a slim coloured limb on top -->
    <path d="M 256 176 C 224 158 190 148 158 156" fill="none" stroke="#2a2333" stroke-width="20" stroke-linecap="round"/>
    <path d="M 256 176 C 288 158 322 148 354 156" fill="none" stroke="#2a2333" stroke-width="20" stroke-linecap="round"/>
    <path d="M 256 176 C 224 158 190 148 158 156" fill="none" stroke="url(#hand-crossbow-blade-light)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 256 176 C 288 158 322 148 354 156" fill="none" stroke="url(#hand-crossbow-blade-dark)" stroke-width="11" stroke-linecap="round"/>
    <!-- Stock, running straight down and perpendicular to the bow -->
    <rect x="243" y="172" width="26" height="118" rx="4" fill="url(#hand-crossbow-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <!-- Pistol grip -->
    <path d="M 256 286 L 256 340 Q 256 358 274 358 L 288 358 L 288 334 L 274 334 L 274 286 Z"
          fill="url(#hand-crossbow-leather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Trigger guard -->
    <path d="M 288 300 Q 314 300 314 322 Q 314 340 294 340 L 288 340 L 288 328 L 296 328 Q 302 328 302 322 Q 302 312 288 312 Z"
          fill="url(#hand-crossbow-brass-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <!-- Bowstring, dipping to the nock point -->
    <path d="M 158 156 Q 256 208 354 156" fill="none" stroke="#e8e0cf" stroke-width="4"/>
    <!-- Loaded bolt, nocked on the string and lying along the stock -->
    <line x1="256" y1="286" x2="256" y2="118" stroke="#5a3d1c" stroke-width="7" stroke-linecap="round"/>
    <polygon points="256,98 272,124 240,124" fill="url(#hand-crossbow-steel-rim)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="243,262 256,232 269,262 256,250" fill="url(#hand-crossbow-feather-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>