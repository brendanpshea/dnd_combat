<svg xmlns="http://www.w3.org/2000/svg" viewBox="54.3 9.5 383 383" width="100%" height="100%">
  <defs>
    <filter id="rapier-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="rapier-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="rapier-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="rapier-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="100%" stop-color="#b8780e"/>
    </linearGradient>

    <linearGradient id="rapier-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- RAPIER (100% Transparent Background) -->
  <g filter="url(#rapier-drop-shadow)" transform="rotate(-45 256 256)">
    <!-- Slender Needle Blade -->
    <polygon points="256,30 250,300 262,300" fill="url(#rapier-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <line x1="256" y1="40" x2="256" y2="295" stroke="#ffffff" stroke-width="2"/>

    <!-- Sweeping Wire Cup Basket Guard -->
    <path d="M 256,290 C 200,270 170,310 240,335 C 290,350 320,300 256,290 Z" fill="url(#rapier-brass-grad)" stroke="#2a2333" stroke-width="5" opacity="0.95"/>
    <circle cx="256" cy="300" r="6" fill="#ffffff" stroke="#2a2333" stroke-width="2"/>

    <!-- Slender Grip -->
    <rect x="249" y="302" width="14" height="45" rx="3" fill="url(#rapier-leather-grad)" stroke="#2a2333" stroke-width="4"/>

    <!-- Urn-Shaped Gold Pommel -->
    <polygon points="256,350 266,358 260,372 252,372 246,358" fill="url(#rapier-gold-grad)" stroke="#2a2333" stroke-width="4"/>
  </g>
</svg>