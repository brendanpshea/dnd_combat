<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -40.5 520 520" data-ink="379" width="100%" height="100%">
  <defs>
    <filter id="longsword-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="longsword-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="longsword-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="longsword-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="longsword-leather-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3422"/>
      <stop offset="50%" stop-color="#3d2013"/>
      <stop offset="100%" stop-color="#241108"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- LONGSWORD (100% Transparent Background) -->
  <g filter="url(#longsword-drop-shadow)" transform="rotate(-45 256 256)">
    <polygon points="256,40 238,300 256,300" fill="url(#longsword-blade-light)"/>
    <polygon points="256,40 274,300 256,300" fill="url(#longsword-blade-dark)"/>

    <line x1="256" y1="70" x2="256" y2="280" stroke="#2a2333" stroke-width="5" stroke-linecap="round"/>
    <line x1="255" y1="70" x2="255" y2="275" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Swept Crossguard -->
    <path d="M 256,295 C 220,290 180,270 160,255 C 155,270 170,290 192,302 C 222,312 242,315 256,315 C 270,315 290,312 320,302 C 342,290 357,270 352,255 C 332,270 292,290 256,295 Z" fill="url(#longsword-gold-grad)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,288 268,302 256,316 244,302" fill="url(#longsword-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <circle cx="256" cy="302" r="5" fill="#e60039" stroke="#2a2333" stroke-width="2"/>
    <rect x="247" y="315" width="18" height="60" rx="3" fill="url(#longsword-leather-grad)" stroke="#2a2333" stroke-width="5"/>
    
    <line x1="247" y1="327" x2="265" y2="327" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="343" x2="265" y2="343" stroke="#f5b324" stroke-width="2.5"/>
    <line x1="247" y1="359" x2="265" y2="359" stroke="#f5b324" stroke-width="2.5"/>
    <circle cx="256" cy="391" r="18" fill="url(#longsword-gold-grad)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="391" r="8" fill="#d9910d" stroke="#2a2333" stroke-width="2"/>
    <circle cx="253" cy="388" r="2.5" fill="#ffffff"/>
    <polygon points="256,40 238,300 274,300" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="256,30 259,37 266,40 259,43 256,50 253,43 246,40 253,37" fill="#ffffff"/>
  </g>
</svg>