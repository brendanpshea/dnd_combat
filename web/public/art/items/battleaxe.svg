<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 38.5 401 401" width="100%" height="100%">
  <defs>
    <filter id="battleaxe-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="battleaxe-blade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#d1dbe5"/>
      <stop offset="100%" stop-color="#99aec4"/>
    </linearGradient>

    <linearGradient id="battleaxe-blade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ba0b8"/>
      <stop offset="100%" stop-color="#4e6278"/>
    </linearGradient>

    <linearGradient id="battleaxe-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#f5b324"/>
      <stop offset="100%" stop-color="#945f21"/>
    </linearGradient>

    <linearGradient id="battleaxe-wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a06037"/>
      <stop offset="50%" stop-color="#734020"/>
      <stop offset="100%" stop-color="#42220f"/>
    </linearGradient>

    <!-- Liquid Gradients -->

  </defs>
  <!-- BATTLEAXE (100% Transparent Background) -->
  <g filter="url(#battleaxe-drop-shadow)" transform="rotate(-45 256 256)">
    <rect x="247" y="120" width="18" height="290" rx="3" fill="url(#battleaxe-wood-grad)" stroke="#2a2333" stroke-width="5"/>
    <polygon points="247,400 265,400 262,418 250,418" fill="url(#battleaxe-gold-grad)" stroke="#2a2333" stroke-width="4"/>
    <polygon points="256,60 264,120 248,120" fill="url(#battleaxe-blade-light)" stroke="#2a2333" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 247,125 Q 140,80 135,175 Q 140,270 247,225 Z" fill="url(#battleaxe-blade-light)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="265" y="145" width="35" height="60" rx="2" fill="url(#battleaxe-blade-dark)" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    <rect x="242" y="135" width="28" height="80" rx="4" fill="#354457" stroke="#2a2333" stroke-width="5"/>
  </g>
</svg>