<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -26 520 520" data-ink="398" width="100%" height="100%">
  <defs>
    <filter id="sword-of-wounding-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#120c1f" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="sword-of-wounding-obsidian" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a148c"/>
      <stop offset="50%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="sword-of-wounding-wound-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
  </defs>
  <g filter="url(#sword-of-wounding-shadow)" transform="rotate(-45 256 256)">
    <!-- Serrated Wounding Blade -->
    <path d="M 256,35 L 272,90 L 265,105 L 275,150 L 267,165 L 277,210 L 268,255 L 256,265 Z" fill="url(#sword-of-wounding-obsidian)"/>
    <path d="M 256,35 L 240,90 L 247,105 L 237,150 L 245,165 L 235,210 L 244,255 L 256,265 Z" fill="url(#sword-of-wounding-obsidian)"/>
    
    <!-- Serrated Outlines -->
    <path d="M 256,35 L 272,90 L 265,105 L 275,150 L 267,165 L 277,210 L 268,255 L 256,265 L 244,255 L 235,210 L 245,165 L 237,150 L 247,105 L 240,90 Z" fill="none" stroke="#2a2333" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Dripping Wounding Runes -->
    <line x1="256" y1="60" x2="256" y2="240" stroke="url(#sword-of-wounding-wound-glow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Guard -->
    <path d="M 180,240 C 220,265 240,270 256,270 C 272,270 292,265 332,240 C 322,270 292,290 256,290 C 220,290 190,270 180,240 Z" fill="url(#sword-of-wounding-obsidian)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="275" r="7" fill="url(#sword-of-wounding-wound-glow)"/>

    <!-- Handle -->
    <rect x="245" y="290" width="22" height="100" rx="4" fill="#212121" stroke="#2a2333" stroke-width="5"/>
    <line x1="245" y1="315" x2="267" y2="315" stroke="#ff1744" stroke-width="2.5"/>
    <line x1="245" y1="345" x2="267" y2="345" stroke="#ff1744" stroke-width="2.5"/>
    <line x1="245" y1="375" x2="267" y2="375" stroke="#ff1744" stroke-width="2.5"/>

    <!-- Pommel -->
    <circle cx="256" cy="415" r="18" fill="url(#sword-of-wounding-obsidian)" stroke="#2a2333" stroke-width="5"/>
    <circle cx="256" cy="415" r="8" fill="url(#sword-of-wounding-wound-glow)"/>
  </g>
</svg>